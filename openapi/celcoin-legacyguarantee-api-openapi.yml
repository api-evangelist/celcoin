openapi: 3.2.0
info:
  title: Legacy Guarantee API
  version: 1.0.0.0
security:
- Bearer: []
tags:
- name: LegacyGuarantee
paths:
  /guarantee/renegotiation-legacy:
    post:
      tags:
      - LegacyGuarantee
      summary: Renegotiate legacy loans (Only for CT)
      requestBody:
        description: Renegotiation request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenegotiationGuaranteeLegacyRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/RenegotiationGuaranteeLegacyRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/RenegotiationGuaranteeLegacyRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuaranteeResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuaranteeResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: postGuaranteeRenegotiationLegacy
      x-operation-id-source: derived
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        correlationId:
          type:
          - string
          - 'null'
        status:
          type:
          - string
          - 'null'
        errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Errs'
      additionalProperties: false
    RenegotiationGuaranteeLegacyRequest:
      required:
      - amount
      - anualTax
      - balanceCheckId
      - cet
      - contractNumber
      - endContractDate
      - initContractDate
      - initDiscountDate
      - installmentAmount
      - installmentQuantity
      - interestTax
      - iof
      - legacyAnnotations
      - monthlyCet
      - netAmount
      type: object
      properties:
        balanceCheckId:
          type: string
          format: uuid
        contractNumber:
          type:
          - string
          - 'null'
        amount:
          type: number
          format: double
        netAmount:
          type: number
          format: double
        interestTax:
          type: number
          format: double
        iof:
          type: number
          format: double
        cet:
          type: number
          format: double
        initContractDate:
          type: string
          format: date-time
        endContractDate:
          type: string
          format: date-time
        anualTax:
          type: number
          format: double
        monthlyCet:
          type: number
          format: double
        installmentAmount:
          type: number
          format: double
        installmentQuantity:
          type: integer
          format: int32
        initDiscountDate:
          type: string
          format: date-time
        legacyAnnotations:
          type:
          - array
          - 'null'
          items:
            type: string
            format: uuid
        expirationAt:
          type:
          - string
          - 'null'
          format: date-time
      additionalProperties: false
    GuaranteeResponse:
      required:
      - annotationType
      - status
      type: object
      properties:
        annotationId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        status:
          type:
          - string
          - 'null'
        annotationType:
          type:
          - string
          - 'null'
      additionalProperties: false
    Errs:
      type: object
      properties:
        code:
          type:
          - string
          - 'null'
        message:
          type:
          - string
          - 'null'
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: http
      description: 'JWT Authorization header using the Bearer scheme. Example: "Authorization: Bearer {token}"'
      scheme: bearer
      bearerFormat: JWT
