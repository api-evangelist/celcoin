openapi: 3.2.0
info:
  title: Bank Correspondent Agent API
  version: 1.0.0.0
security:
- Bearer: []
tags:
- name: BankCorrespondentAgent
paths:
  /correspAgent:
    post:
      tags:
      - BankCorrespondentAgent
      summary: Creates a new bank correspondent agent
      requestBody:
        description: Data required to create the bank correspondent agent.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCorrespAgentRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateCorrespAgentRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateCorrespAgentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCorrespAgentResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: postCorrespAgent
      x-operation-id-source: derived
    get:
      tags:
      - BankCorrespondentAgent
      parameters:
      - name: id
        in: query
        schema:
          type: string
          format: uuid
      - name: correspAgentId
        in: query
        schema:
          type: string
      - name: consigneeId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: document
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCorrespAgentResponse'
        '204':
          description: No Content
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get corresp agent
      x-summary-source: derived
      operationId: getCorrespAgent
      x-operation-id-source: derived
  /bankcorrespondentagent/{correspAgentId}:
    put:
      tags:
      - BankCorrespondentAgent
      summary: Update an existing bank correspondent agent
      parameters:
      - name: correspAgentId
        in: path
        description: ''
        required: true
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBankCorrespondentAgentRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/UpdateBankCorrespondentAgentRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UpdateBankCorrespondentAgentRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankCorrespondentAgentResponse'
        '304':
          description: Not Modified
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: putBankcorrespondentagentByCorrespAgentId
      x-operation-id-source: derived
    delete:
      tags:
      - BankCorrespondentAgent
      summary: Inactivate an existing bank correspondent agent
      parameters:
      - name: correspAgentId
        in: path
        description: ''
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankCorrespondentAgentResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: deleteBankcorrespondentagentByCorrespAgentId
      x-operation-id-source: derived
components:
  schemas:
    UpdateBankCorrespondentAgentRequest:
      type: object
      properties:
        socialName:
          type:
          - string
          - 'null'
        document:
          type:
          - string
          - 'null'
      additionalProperties: false
    CreateCorrespAgentRequest:
      required:
      - consigneeId
      - correspondentAgencyId
      - document
      - socialName
      type: object
      properties:
        correspondentAgencyId:
          type:
          - string
          - 'null'
        consigneeId:
          type: string
          format: uuid
        socialName:
          type:
          - string
          - 'null'
        document:
          type:
          - string
          - 'null'
      additionalProperties: false
    CreateCorrespAgentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        correspondentAgencyId:
          type:
          - string
          - 'null'
        consigneeId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    GetCorrespAgentResponse:
      type: object
      properties:
        page:
          type: integer
          format: int32
        pageCount:
          type: integer
          format: int64
        pageSize:
          type: integer
          format: int32
        totalItens:
          type: integer
          format: int64
        correspondents:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CorrespondentAgent'
      additionalProperties: false
    Errs:
      type: object
      properties:
        code:
          type:
          - string
          - 'null'
        message:
          type:
          - string
          - 'null'
      additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        correlationId:
          type:
          - string
          - 'null'
        status:
          type:
          - string
          - 'null'
        errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Errs'
      additionalProperties: false
    CorrespondentAgent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        correspAgentId:
          type:
          - string
          - 'null'
        consigneeId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
      additionalProperties: false
    BankCorrespondentAgentResponse:
      required:
      - consigneeId
      - correspAgentId
      - createdAt
      - id
      type: object
      properties:
        id:
          type: string
          format: uuid
        correspAgentId:
          type:
          - string
          - 'null'
        consigneeId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: http
      description: 'JWT Authorization header using the Bearer scheme. Example: "Authorization: Bearer {token}"'
      scheme: bearer
      bearerFormat: JWT
