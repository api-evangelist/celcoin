    url: https://developers.celcoin.com.br/docs/pagamento-de-contas-1
  - type: Reference
    url: https://developers.celcoin.com.br/reference
- aid: celcoin:open-finance
  name: Celcoin Open Finance API
  description: >-
    Open Finance and Open Banking APIs for Payment Initiation (ITP with and without redirect), account
    linking with FIDO biometrics, data sharing and consent management, and sweeping accounts for intelligent
    automated transfers.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.celcoin.com.br/docs
  baseURL: https://tpp.opb.celcoin.com.br/
