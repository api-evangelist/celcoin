  - type: Documentation
    url: https://developers.celcoin.com.br/docs
  - type: Reference
    url: https://developers.celcoin.com.br/reference
- aid: celcoin:payments
  name: Celcoin Payments API
  description: >-
    Embedded payment APIs covering bill payments, mobile recharges, vehicle debit, payment gateway with
    multi-acquirer support, Pix instant payments, withdrawals and deposits, and Payment Initiation (ITP)
    under the Brazilian Open Finance framework.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.celcoin.com.br/docs/pagamento-de-contas-1
  baseURL: https://api.openfinance.celcoin.com.br/
  tags:
  - Payments
  - Bill Payments
  - Pix
  - Recharges
  - Payment Gateway
