- aid: celcoin:cards
  name: Celcoin Card Solutions API
  description: >-
    APIs for white-label card account creation and management, card issuance and tracking, transaction
    simulation, post-paid invoice management, recurring subscriptions, and webhook-driven card event notifications.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.celcoin.com.br/docs
